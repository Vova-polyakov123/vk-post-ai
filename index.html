<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>AI Контент Студия</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef2f7;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #ff7a00;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      opacity: 0.8;
    }

    .active {
      outline: 3px solid black;
      opacity: 1;
    }

    .ads {
      background: #ff7a00;
    }

    .idea {
      background: #9b59b6;
    }

    .sales {
      background: #2ecc71;
    }

    .post {
      background: #3498db;
    }

    .input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .gen-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: orange;
      border: none;
      color: white;
      border-radius: 10px;
    }

    .result {
      margin-top: 15px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      min-height: 120px;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
    }

    .copy {
      background: #ff7a00;
    }

    .voice {
      background: #2ecc71;
    }

    .stop {
      background: #e67e22;
    }

    .pay {
      background: #e74c3c;
    }

    /* MODAL (без alert — по правилам VK) */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 320px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h2>AI Контент Студия</h2>
      <div>Бесплатно: <span id="freeLeft">3</span></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:10px;">
      <button class="button ads active" onclick="setMode('ads',this)">Реклама</button>
      <button class="button idea" onclick="setMode('idea',this)">Идея</button>
      <button class="button sales" onclick="setMode('sales',this)">Продажи</button>
      <button class="button post" onclick="setMode('post',this)">Пост</button>
    </div>

    <input id="input" class="input" placeholder="Введите тему">

    <button class="gen-btn" onclick="generate()">Сгенерировать 🚀</button>

    <div class="result" id="result"></div>

    <div class="actions">
      <button class="copy" onclick="copyText()">Копировать</button>
      <button class="voice" onclick="speakText()">Озвучка</button>
      <button class="stop" onclick="stopSpeech()">Стоп</button>
      <button class="pay" onclick="openPremium()">Премиум 💎</button>
    </div>

  </div>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>

    let mode = "ads";
    let free = 3;
    let vk = false;

    /* INIT VK */
    window.addEventListener("load", async () => {
      try {
        await vkBridge.send("VKWebAppInit");
        vk = true;
      } catch {
        vk = false;
      }

      updateUI();
      showOnboarding();
    });

    /* ONBOARDING (VK RULE 4.1.6.4) */
    function showOnboarding() {
      if (localStorage.getItem("onboarded")) return;

      openModal(`
    <h3>Добро пожаловать 🚀</h3>
    <p>Создавай тексты для рекламы, постов и идей</p>
    <p>3 бесплатные генерации каждый день</p>
    <button onclick="closeModal()">Начать</button>
  `);

      localStorage.setItem("onboarded", "1");
    }

    /* MODAL */
    function openModal(html) {
      modalContent.innerHTML = html;
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    /* MODE */
    function setMode(m, b) {
      mode = m;
      document.querySelectorAll(".button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    }

    /* UI */
    function updateUI() {
      freeLeft.innerText = free;
    }

    /* GENERATE */
    async function generate() {

      const text = input.value;
      if (!text) return;

      if (free <= 0) {
        openModal("<h3>Лимит закончился</h3><p>Купи Premium для безлимита</p>");
        return;
      }

      free--;
      updateUI();

      result.innerText = "Генерация...";

      try {

        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text, mode })
        });

        const data = await res.json();

        result.innerText = (data.text || "Ошибка")
          .replace(/[*#•]/g, "")
          .trim();

      } catch {
        result.innerText = "Ошибка сервера";
      }
    }

    /* COPY */
    function copyText() {
      navigator.clipboard.writeText(result.innerText);
    }

    /* SPEECH */
    function speakText() {
      const msg = new SpeechSynthesisUtterance(result.innerText);
      msg.lang = "ru-RU";
      speechSynthesis.speak(msg);
    }

    function stopSpeech() {
      speechSynthesis.cancel();
    }

    /* VK PAY (ПРАВИЛЬНО) */
    async function openPremium() {

      if (!vk) {
        openModal("<h3>Ошибка</h3><p>Оплата доступна только внутри VK</p>");
        return;
      }

      try {

        const res = await vkBridge.send("VKWebAppShowOrderBox", {
          type: "item",
          item: "premium_1"
        });

        if (res?.status === "success") {
          free = 999;
          updateUI();

          openModal("<h3>💎 Premium активирован</h3><p>Теперь без лимитов</p>");
        } else {
          openModal("<p>Оплата отменена</p>");
        }

      } catch {
        openModal("<p>Ошибка оплаты</p>");
      }
    }

  </script>

</body>

</html>
