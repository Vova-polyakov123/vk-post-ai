<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>AI Контент Студия</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef2f7;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #ff7a00;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .active {
      outline: 3px solid black;
    }

    .ads {
      background: #ff7a00;
    }

    .idea {
      background: #9b59b6;
    }

    .sales {
      background: #2ecc71;
    }

    .post {
      background: #3498db;
    }

    .input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .gen-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: orange;
      border: none;
      color: white;
      border-radius: 10px;
    }

    .result {
      margin-top: 15px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      min-height: 120px;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
    }

    .copy {
      background: #ff7a00;
    }

    .voice {
      background: #2ecc71;
    }

    .stop {
      background: #e67e22;
    }

    .pay {
      background: #e74c3c;
    }

    /* MODAL (VK compliant) */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 320px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h2>AI Контент Студия</h2>
      <div>Бесплатно: <span id="freeLeft">3</span></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:10px;">
      <button class="button ads active" onclick="setMode('ads',this)">Реклама</button>
      <button class="button idea" onclick="setMode('idea',this)">Идея</button>
      <button class="button sales" onclick="setMode('sales',this)">Продажи</button>
      <button class="button post" onclick="setMode('post',this)">Пост</button>
    </div>

    <input id="input" class="input" placeholder="Введите тему">

    <button class="gen-btn" onclick="generate()">Сгенерировать 🚀</button>

    <div class="result" id="result"></div>

    <div class="actions">
      <button class="copy" onclick="copyText()">Копировать</button>
      <button class="voice" onclick="speak()">🔊</button>
      <button class="stop" onclick="speechSynthesis.cancel()">⛔</button>
      <button class="pay" onclick="openPremium()">💎 Premium</button>
    </div>

  </div>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>

    let mode = "ads";
    let free = localStorage.getItem("free") ? +localStorage.getItem("free") : 3;
    let premium = localStorage.getItem("premium") === "1";
    let vkPlatform = "web";

    const modal = document.getElementById("modal");
    const modalContent = document.getElementById("modalContent");

    function showModal(html) {
      modalContent.innerHTML = html;
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    /* ONBOARDING (VK RULE 4.1.6.4) */
    window.addEventListener("load", async () => {
      try {
        const info = await vkBridge.send("VKWebAppGetClientInfo");
        vkPlatform = info.platform || "web";
      } catch { }

      if (!localStorage.getItem("seen")) {
        showModal(`
      <h3>Добро пожаловать 🚀</h3>
      <p>Это AI сервис:</p>
      <p>• генерация постов<br>• реклама<br>• идеи</p>
      <button onclick="startApp()">Начать</button>
    `);
      }
    });

    function startApp() {
      localStorage.setItem("seen", "1");
      closeModal();
    }

    function setMode(m, b) {
      mode = m;
      document.querySelectorAll(".button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    }

    /* GENERATE */
    async function generate() {

      const text = input.value;
      if (!text) return;

      if (!premium && free <= 0) {
        showModal("<h3>Лимит закончился</h3><p>Купите Premium</p>");
        return;
      }

      if (!premium) {
        free--;
        localStorage.setItem("free", free);
        freeLeft.innerText = free;
      }

      result.innerText = "⏳ генерация...";

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text, mode })
        });

        const data = await res.json();

        result.innerText = (data.text || "error")
          .replace(/[*#]/g, "");

      } catch {
        result.innerText = "ошибка сервера";
      }
    }

    /* COPY */
    function copyText() {
      navigator.clipboard.writeText(result.innerText);
    }

    /* SPEAK */
    function speak() {
      const s = new SpeechSynthesisUtterance(result.innerText);
      s.lang = "ru-RU";
      speechSynthesis.speak(s);
    }

    /* VK PAY (RULE COMPLIANT) */
    async function openPremium() {

      // ❌ запрещаем оплату на мобилках VK (RULE 5.4.1)
      if (vkPlatform === "android" || vkPlatform === "ios") {
        showModal("<p>Оплата недоступна на мобильных клиентах VK</p>");
        return;
      }

      try {
        const res = await vkBridge.send("VKWebAppShowOrderBox", {
          type: "item",
          item: "premium_1"
        });

        if (res.status === "success") {
          premium = true;
          localStorage.setItem("premium", "1");
          showModal("<h3>Premium активирован 💎</h3>");
        }

      } catch {
        showModal("<p>Ошибка оплаты</p>");
      }
    }

  </script>

</body>

</html>
