<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>AI Контент Студия</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script&gt;

<style>
body { margin:0; font-family:Arial; background:#eef2f7; }

.container { max-width:900px; margin:auto; padding:20px; }

.header {
  background:#ff7a00; color:white; padding:20px;
  border-radius:12px; text-align:center;
}

.robot-float {
  position:fixed; top:10px; right:15px;
  z-index:9999; text-align:center;
}

.robot { width:80px; animation:float 2s infinite; }

@keyframes float {
  0% { transform:translateY(0); }
  50% { transform:translateY(-10px); }
  100% { transform:translateY(0); }
}

.mouth {
  width:20px; height:4px; background:black;
  margin:5px auto; border-radius:10px;
}

.robot-text {
  font-size:11px; background:rgba(0,0,0,0.6);
  color:white; padding:5px; border-radius:8px;
}

.button {
  padding:12px; border:none; border-radius:10px;
  color:white; font-weight:bold; opacity:0.8; cursor:pointer;
}

.active { outline:3px solid black; opacity:1; }

.ads { background:#ff7a00; }
.idea { background:#9b59b6; }
.sales { background:#2ecc71; }
.post { background:#3498db; }

.input { width:100%; padding:10px; margin-top:10px; }

.gen-btn {
  width:100%; margin-top:10px; padding:12px;
  background:orange; border:none; color:white;
  border-radius:10px;
}

.result {
  margin-top:15px; background:white;
  padding:10px; border-radius:10px;
  min-height:120px;
  white-space:pre-wrap;
}

.actions { display:flex; gap:10px; margin-top:10px; }

.actions button {
  flex:1; padding:10px; border:none;
  border-radius:10px; color:white; font-weight:bold;
}

.copy { background:#ff7a00; }
.voice { background:#2ecc71; }
.stop { background:#e67e22; }
.magic { background:#9b59b6; }
.pay { background:#e74c3c; }
</style>
</head>

<body>

<div id="robotBox" class="robot-float">
  <img class="robot" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"&gt;
  <div class="mouth"></div>
  <div id="robotText" class="robot-text">🤖 загрузка...</div>
</div>

<div class="container">

<div class="header">
<h2>AI Контент Студия</h2>
<div>Бесплатно: <span id="freeLeft">3</span></div>
</div>

<div style="display:flex;gap:10px;margin-top:10px;">
<button class="button ads active" onclick="setMode('ads',this)">Реклама</button>
<button class="button idea" onclick="setMode('idea',this)">Идея</button>
<button class="button sales" onclick="setMode('sales',this)">Продажи</button>
<button class="button post" onclick="setMode('post',this)">Пост</button>
</div>

<input id="input" class="input" placeholder="Введите тему">

<button class="gen-btn" onclick="generate()">Сгенерировать 🚀</button>

<div class="result" id="result"></div>

<div class="actions">
<button class="copy" onclick="copyText()">Копировать 📋</button>
<button class="voice" onclick="speakText()">Озвучить 🔊</button>
<button class="stop" onclick="stopSpeech()">Стоп ⛔</button>
<button class="magic" onclick="upgrade()">Улучшить ✨</button>
<button class="pay" onclick="openPremium()">Премиум 💎</button>
</div>

</div>

<script>

  let mode = "ads";
  let free = 3;
  let vk = false;

  window.addEventListener("load", async () => {
    try {
      await vkBridge.send("VKWebAppInit");
      vk = true;
      document.getElementById("robotText").innerText = "🤖 VK режим активен";
    } catch {
      vk = false;
      document.getElementById("robotText").innerText = "🤖 обычный режим";
    }
  });

  function setMode(m, b) {
    mode = m;
    document.querySelectorAll(".button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
  }

  function robotSay(t) {
    document.getElementById("robotText").innerText = t;
  }

  async function generate() {

    const text = input.value;
    if (!text) return;

    if (free <= 0) {
      result.innerText = "❌ Лимит закончился";
      return;
    }

    free--;
    freeLeft.innerText = free;

    robotSay("⏳ Генерация идёт...");

    try {

      const


        res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text, mode })
        });

      const data = await res.json();

      let clean = (data?.text || "Ошибка")
        .replace(/[*#•]/g, "")
        .trim();

      result.innerText = clean + " 🚀✨😊";

      robotSay("🤖 Готово!");

    } catch {
      result.innerText = "Ошибка сервера ❌";
      robotSay("❌ ошибка");
    }
  }

  function copyText() {
    navigator.clipboard.writeText(result.innerText);
  }

  function speakText() {
    const msg = new SpeechSynthesisUtterance(result.innerText);
    msg.lang = "ru-RU";
    speechSynthesis.speak(msg);
  }

  function stopSpeech() {
    speechSynthesis.cancel();
  }

  function upgrade() {
    result.innerText += "\n✨ улучшено AI";
  }

  /* ✅ РАБОЧАЯ VK ОПЛАТА */
  async function openPremium() {

    if (!vk) {
      alert("💎 Только внутри VK");
      return;
    }

    robotSay("💳 открываю оплату...");

    try {

      const res = await vkBridge.send("VKWebAppShowOrderBox", {
        type: "item",
        item: "premium_1"
      });

      console.log("PAY RESULT:", res);

      if (res?.status === "success") {
        robotSay("✅ Премиум активирован!");
        result.innerText = "💎 Premium включён 😊🚀";
      } else {
        robotSay("⛔ Оплата отменена");
      }

    } catch (e) {
      console.log(e);
      robotSay("❌ ошибка оплаты");
      alert("Ошибка оплаты (проверь монетизацию VK)");
    }
  }

</script>

  </body>

</html>
