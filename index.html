<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>AI Контент Студия</title>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef2f7;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .header {
      background: #ff7a00;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    /* ROBOT */
    .robot-box {
      position: fixed;
      top: 10px;
      right: 10px;
      text-align: center;
      z-index: 9999;
    }

    .robot {
      width: 80px;
      transition: 0.3s;
      animation: float 2s infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }

      100% {
        transform: translateY(0);
      }
    }

    .robot-mouth {
      width: 20px;
      height: 6px;
      background: black;
      margin: 5px auto;
      border-radius: 10px;
      transition: 0.3s;
    }

    .robot-text {
      font-size: 11px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 5px;
      border-radius: 8px;
    }

    /* UI */
    .button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      opacity: 0.8;
    }

    .active {
      outline: 3px solid black;
      opacity: 1;
    }

    .ads {
      background: #ff7a00;
    }

    .idea {
      background: #9b59b6;
    }

    .sales {
      background: #2ecc71;
    }

    .post {
      background: #3498db;
    }

    .input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .gen-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: orange;
      border: none;
      color: white;
      border-radius: 10px;
    }

    .result {
      margin-top: 15px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      min-height: 120px;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
    }

    .copy {
      background: #ff7a00;
    }

    .voice {
      background: #2ecc71;
    }

    .stop {
      background: #e67e22;
    }

    .pay {
      background: #e74c3c;
    }

    /* MODAL */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 320px;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- 🤖 ROBOT -->
  <div class="robot-box">
    <img id="robotImg" class="robot" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">

    <div class="robot-mouth" id="robotMouth"></div>
    <div class="robot-text" id="robotText">🤖 загрузка...</div>
  </div>

  <div class="container">

    <div class="header">
      <h2>AI Контент Студия</h2>
      <div>Бесплатно: <span id="freeLeft">3</span></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:10px;">
      <button class="button ads active" onclick="setMode('ads',this)">Реклама</button>
      <button class="button idea" onclick="setMode('idea',this)">Идея</button>
      <button class="button sales" onclick="setMode('sales',this)">Продажи</button>
      <button class="button post" onclick="setMode('post',this)">Пост</button>
    </div>

    <input id="input" class="input" placeholder="Введите тему">

    <button class="gen-btn" onclick="generate()">Сгенерировать 🚀</button>

    <div class="result" id="result"></div>

    <div class="actions">
      <button class="copy" onclick="copyText()">Копировать</button>
      <button class="voice" onclick="speakText()">Озвучка</button>
      <button class="stop" onclick="stopSpeech()">Стоп</button>
      <button class="pay" onclick="openPremium()">Премиум 💎</button>
    </div>

  </div>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>

    let mode = "ads";
    let free = 3;
    let vk = false;

    /* ROBOT STATE */
    function robot(state, text) {
      const img = document.getElementById("robotImg");
      const mouth = document.getElementById("robotMouth");

      if (state === "happy") {
        img.style.transform = "scale(1.05)";
        mouth.style.background = "green";
      }

      if (state === "thinking") {
        img.style.transform = "scale(0.95)";
        mouth.style.background = "orange";
      }

      if (state === "sad") {
        img.style.transform = "scale(1)";
        mouth.style.background = "red";
      }

      document.getElementById("robotText").innerText = text;
    }

    /* INIT VK */
    window.addEventListener("load", async () => {
      try {
        await vkBridge.send("VKWebAppInit");
        vk = true;
        robot("happy", "🤖 VK режим активен");
      } catch {
        vk = false;
        robot("sad", "🤖 оффлайн режим");
      }

      showOnboarding();
      updateUI();
    });

    /* ONBOARDING (VK RULE) */
    function showOnboarding() {
      if (localStorage.getItem("onboarded")) return;

      openModal(`
    <h3>👋 Добро пожаловать!</h3>
    <p>Я помогу тебе создавать тексты для рекламы, постов и идей.</p>
    <p>У тебя есть 3 бесплатные генерации.</p>
    <button onclick="closeModal()">Начать</button>
  `);

      localStorage.setItem("onboarded", "1");
    }

    /* MODAL */
    function openModal(html) {
      modalContent.innerHTML = html;
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    /* MODE */
    function setMode(m, b) {
      mode = m;
      document.querySelectorAll(".button").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    }

    /* UI */
    function updateUI() {
      freeLeft.innerText = free;
    }

    /* GENERATE */
    async function generate() {

      const text = input.value;
      if (!text) return;

      if (free <= 0) {
        robot("sad", "Лимит закончился 💔");
        openModal("<h3>Лимит 0</h3><p>Купи Premium 💎</p>");
        return;
      }

      free--;
      updateUI();

      robot("thinking", "🤖 думаю...");

      try {

        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text, mode })
        });

        const data = await res.json();

        result.innerText = (data.text || "Ошибка")
          .replace(/[*#•]/g, "")
          .trim();

        robot("happy", "Готово 🚀");

      } catch {
        result.innerText = "Ошибка сервера";
        robot("sad", "ошибка ❌");
      }
    }

    /* COPY */
    function copyText() {
      navigator.clipboard.writeText(result.innerText);
    }

    /* SPEECH */
    function speakText() {
      const msg = new SpeechSynthesisUtterance(result.innerText);
      msg.lang = "ru-RU";
      speechSynthesis.speak(msg);
    }

    function stopSpeech() {
      speechSynthesis.cancel();
    }

    /* VK PAY */
    async function openPremium() {

      if (!vk) {
        openModal("<p>Только VK версия</p>");
        return;
      }

      robot("thinking", "💳 открываю оплату...");

      try {

        const res = await vkBridge.send("VKWebAppShowOrderBox", {
          type: "item",
          item: "premium_1"
        });

        if (res?.status === "success") {
          free = 999;
          updateUI();
          robot("happy", "Premium активен 💎");
          openModal("<h3>💎 Premium включён</h3>");
        } else {
          robot("sad", "отмена оплаты");
        }

      } catch {
        robot("sad", "ошибка оплаты");
      }
    }

  </script>

</body>

</html>
