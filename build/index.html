  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef2f7
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px
    }

    .header {
      background: #ff7a00;
      color: #fff;
      padding: 20px;
      border-radius: 12px;
      text-align: center
    }

    .robot-float {
      position: fixed;
      top: 10px;
      right: 15px;
      z-index: 9999;
      text-align: center
    }

    .robot {
      width: 80px;
      animation: float 2s infinite
    }

    @keyframes float {
      0% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-10px)
      }

      100% {
        transform: translateY(0)
      }
    }

    .mouth {
      width: 20px;
      height: 4px;
      background: #000;
      margin: 5px auto;
      border-radius: 10px
    }

    .robot-text {
      font-size: 11px;
      background: rgba(0, 0, 0, .65);
      color: #fff;
      padding: 6px;
      border-radius: 8px;
      max-width: 180px
    }

    .button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: bold;
      opacity: .85;
      cursor: pointer
    }

    .active {
      outline: 3px solid #000;
      opacity: 1
    }

    .ads {
      background: #ff7a00
    }

    .idea {
      background: #9b59b6
    }

    .sales {
      background: #2ecc71
    }

    .post {
      background: #3498db
    }

    .input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      box-sizing: border-box
    }

    .gen-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: orange;
      border: none;
      color: #fff;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer
    }

    .result {
      margin-top: 15px;
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      min-height: 120px;
      white-space: pre-wrap
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px
    }

    .actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: bold;
      cursor: pointer
    }

    .copy {
      background: #ff7a00
    }

    .voice {
      background: #2ecc71
    }

    .stop {
      background: #e67e22
    }

    .magic {
      background: #9b59b6
    }

    .pay {
      background: #e74c3c
    }

    .notice {
      margin-top: 12px;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      color: #333
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000
    }

    .modal-box {
      width: min(420px, 90vw);
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      text-align: center
    }

    .modal-box button {
      margin-top: 12px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #ff7a00;
      color: #fff;
      font-weight: bold;
      cursor: pointer
    }

    .hidden {
      display: none !important
    }
  </style>

<body>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h3 id="modalTitle">Добро пожаловать 👋</h3>
      <div id="modalText">
        Это AI Контент Студия.<br><br>
        Доступно:<br>
        • Реклама<br>
        • Идеи<br>
        • Продажи<br>
        • Посты
      </div>
      <button onclick="closeModal()">Понятно</button>
    </div>
  </div>

  <div id="robotBox" class="robot-float">
    <img class="robot" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
    <div class="mouth"></div>
    <div id="robotText" class="robot-text">🤖 загрузка...</div>
  </div>

  <div class="container">

    <div class="header">
      <h2>AI Контент Студия</h2>
      <div>Бесплатно: <span id="freeLeft">3</span></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
      <button class="button ads active" onclick="setMode('ads',this)">Реклама</button>
      <button class="button idea" onclick="setMode('idea',this)">Идея</button>
      <button class="button sales" onclick="setMode('sales',this)">Продажи</button>
      <button class="button post" onclick="setMode('post',this)">Пост</button>
    </div>

    <input id="input" class="input" placeholder="Введите тему">
    <button class="gen-btn" onclick="generate()">Сгенерировать 🚀</button>

    <div class="result" id="result"></div>

    <div class="actions">
      <button class="copy" onclick="copyText()">Копировать 📋</button>
      <button class="voice" onclick="speakText()">Озвучить 🔊</button>
      <button class="stop" onclick="stopSpeech()">Стоп ⛔</button>
      <button class="magic" onclick="upgrade()">Улучшить ✨</button>
      <button id="payBtn" class="pay" onclick="openPremium()">Премиум 💎</button>
    </div>

    <div class="notice">
      Платная функция: Premium — безлимитная генерация контента.<br>
      Оплата доступна только через одобренный способ оплаты VK в web-версии.
    </div>

  </div>

  <script>
    let mode = "ads";
    let vk = false;
    let vkPlatform = "web";

    const inputEl = document.getElementById("input");
    const resultEl = document.getElementById("result");
    const freeLeftEl = document.getElementById("freeLeft");
    const robotTextEl = document.getElementById("robotText");
    const payBtn = document.getElementById("payBtn");

    let free = Number(localStorage.getItem("free") || 3);
    let premium = localStorage.getItem("premium") === "true";
    freeLeftEl.textContent = premium ? "∞" : free;

    function robotSay(text) {
      robotTextEl.textContent = text;
    }

    function showModal(title, text) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalText").innerHTML = text;
      document.getElementById("modal").style.display = "flex";
    }
    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    if (!localStorage.getItem("onboarded")) {
      showModal(
        "Добро пожаловать 👋",
        "Это AI Контент Студия.<br><br>Создавайте рекламу, идеи, продажи и посты за секунды."
      );
      localStorage.setItem("onboarded", "true");
    }

    window.addEventListener("load", async () => {
      try {
        await vkBridge.send("VKWebAppInit");
        vk = true;

        const info = await vkBridge.send("VKWebAppGetClientInfo");
        vkPlatform = info.platform || "web";

        // по правилам VK для цифровых ценностей — не показываем оплату на mobile клиентах
        if (vkPlatform === "ios" || vkPlatform === "android") {
          payBtn.classList.add("hidden");
        }

        robotSay("🤖 VK режим активен");
      } catch (e) {
        vk = false;
        robotSay("🤖 обычный режим");
      }
    });

    function setMode(m, btn) {
      mode = m;
      document.querySelectorAll(".button").forEach(x => x.classList.remove("active"));
      btn.classList.add("active");
    }

    async function generate() {
      const text = inputEl.value.trim();
      if (!text) return;

      if (!premium && free <= 0) {
        resultEl.innerText = "Лимит бесплатных генераций закончился.";
        return;
      }

      if (!premium) {
        free--;
        localStorage.setItem("free", free);
        freeLeftEl.textContent = free;
      }

      robotSay("⏳ Генерация...");

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text, mode })
        });

        const data = await res.json();

        const clean = String(data?.text || "Ошибка генерации")
          .replace(/[*#•]/g, "")
          .replace(/\s+/g, " ")
          .trim();

        resultEl.innerText = clean;
        robotSay("🤖 Готово!");
      } catch (e) {
        resultEl.innerText = "Ошибка сервера";
        robotSay("❌ ошибка");
      }
    }

    function copyText() {
      navigator.clipboard.writeText(resultEl.innerText);
    }

    function speakText() {
      const txt = resultEl.innerText.trim();
      if (!txt) return;
      const msg = new SpeechSynthesisUtterance(txt);
      msg.lang = "ru-RU";
      speechSynthesis.speak(msg);
    }

    function stopSpeech() {
      speechSynthesis.cancel();
    }

    function upgrade() {
      if (resultEl.innerText.trim()) {
        resultEl.innerText += "\nУлучшено AI";
      }
    }

    async function openPremium() {
      if (!vk) {
        showModal("Информация", "Оплата доступна внутри VK.");
        return;
      }

      if (vkPlatform === "ios" || vkPlatform === "android") {
        showModal("Недоступно", "На мобильных клиентах VK оплата цифровых функций недоступна.");
        return;
      }

      robotSay("💳 Открываю оплату...");

      try {
        const res = await vkBridge.send("VKWebAppShowOrderBox", {
          type: "item",
          item: "premium_1"
        });

        if (res?.status === "success") {
          premium = true;
          localStorage.setItem("premium", "true");
          freeLeftEl.textContent = "∞";
          resultEl.innerText = "💎 Premium активирован";
          robotSay("✅ Premium активирован!");
        } else {
          robotSay("⛔ Оплата отменена");
        }
      } catch (e) {
        robotSay("❌ ошибка оплаты");
        showModal("Ошибка", "Проверь, что item premium_1 создан в настройках монетизации VK.");
      }
    }
  </script>
